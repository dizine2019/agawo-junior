{% extends "base.html" %}
{% block content %}

<style>
.container {
    max-width: 1000px;
    margin: 30px auto;
    background: #ffffff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    font-family: Arial, sans-serif;
}

h2 {
    text-align: center;
    color: #3498db;
    margin-bottom: 20px;
}

.form-row {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.form-row input,
.form-row select {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ddd;
}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.btn-add {
    background: #2ecc71;
    color: white;
}

.btn-save {
    background: #3498db;
    color: white;
}

.btn-remove {
    background: #e74c3c;
    color: white;
    padding: 5px 10px;
}

button:hover {
    opacity: 0.9;
}

.table-container {
    max-height: 300px;
    overflow-y: auto;
    margin-top: 20px;
    border: 1px solid #ddd;
    border-radius: 8px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

table th {
    background: #3498db;
    color: white;
    padding: 10px;
    position: sticky;
    top: 0;
    z-index: 2;
}

table td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

tr:hover {
    background: #f9f9f9;
}
</style>

<div class="container">

    <h2>Add Students</h2>

    <!-- STUDENT + ADMISSION -->
    <div class="form-row">
        <input type="text" id="student_name" placeholder="Student Full Name (e.g. John Mwangi)">
        <input type="text" id="admission_number" placeholder="Admission No">
    </div>

    <!-- PARENT + GRADE -->
    <div class="form-row">
        <input type="text" id="parent_name" placeholder="Parent Full Name (e.g. Mary Wanjiku)">
        <input type="text" id="parent_phone" placeholder="Parent Phone Number">
        <select id="grade">
            {% for g in grades %}
                <option value="{{ g }}">{{ g }}</option>
            {% endfor %}
        </select>
    </div>

    <div style="display:flex; gap:10px;">
        <button class="btn-add" onclick="addStudent()">+ Add Student</button>
        <button class="btn-save" onclick="submitAll()">Save All</button>
    </div>

    <!-- SCROLLABLE TABLE -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Adm No</th>
                    <th>Parent Name</th>
                    <th>Phone</th>
                    <th>Grade</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>
    </div>

</div>

<script>
let students = [];
let lastAdmission = "";

// ADD STUDENT
function addStudent() {
    let student = document.getElementById("student_name").value.trim();
    let adm = document.getElementById("admission_number").value.trim();
    let parent = document.getElementById("parent_name").value.trim();
    let phone = document.getElementById("parent_phone").value.trim();
    let grade = document.getElementById("grade").value;

    if (!student || !adm) {
        alert("Please fill Student Name and Admission Number");
        return;
    }

    students.push({
        student_name: student,
        admission_number: adm,
        parent_name: parent,
        parent_phone: phone,
        grade: grade
    });

    lastAdmission = adm;

    students.sort((a, b) => a.student_name.localeCompare(b.student_name));

    renderTable();
    clearInputs();
    generateNextAdmission();
}

// AUTO ADMISSION NUMBER
function generateNextAdmission() {
    if (!lastAdmission) return;

    let num = parseInt(lastAdmission, 10);
    if (isNaN(num)) return;

    num += 1;

    let next = String(num).padStart(lastAdmission.length, '0');

    document.getElementById("admission_number").value = next;
}

// CLEAR INPUTS
function clearInputs() {
    document.getElementById("student_name").value = "";
    document.getElementById("parent_name").value = "";
    document.getElementById("parent_phone").value = "";
}

// RENDER TABLE
function renderTable() {
    let table = document.getElementById("studentTable");
    table.innerHTML = "";

    students.forEach((s, index) => {
        let row = `
            <tr>
                <td>${s.student_name}</td>
                <td>${s.admission_number}</td>
                <td>${s.parent_name || '-'}</td>
                <td>${s.parent_phone || '-'}</td>
                <td>${s.grade}</td>
                <td>
                    <button class="btn-remove" onclick="removeStudent(${index})">Remove</button>
                </td>
            </tr>
        `;
        table.innerHTML += row;
    });
}

// REMOVE
function removeStudent(index) {
    students.splice(index, 1);
    renderTable();
}

// SUBMIT ALL
function submitAll() {
    if (students.length === 0) {
        alert("No students to save");
        return;
    }

    // 1. Target the first added student row inside the tracking array securely
    let firstStudent = students[0];
    let rawGrade = firstStudent.grade;

    // 2. Extract ONLY the numeric digits out of the string (e.g. converting "Grade 4" into "4")
    let targetRouteParam = rawGrade.replace(/\D/g, '').trim();

    // 3. Set a fallback value if no numbers are found to avoid structural URL breaking
    if (!targetRouteParam) {
        targetRouteParam = "1";
    }

    fetch("{% url 'add_students_bulk' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: JSON.stringify({students: students})
    })
    .then(response => {
        if (!response.ok) {
            return response.json().then(errData => {
                throw new Error(errData.message || 'Server error encountered.');
            });
        }
        return response.json();
    })
    .then(data => {
        if (data.success) {
            alert("Students saved successfully!");
            students = [];
            renderTable();
            // Clean redirect that satisfies path('grades/<int:grade>/') layout exactly
            window.location.href = "/grades/" + encodeURIComponent(targetRouteParam) + "/";
        } else {
            alert("Error saving: " + data.message);
        }
    })
    .catch(error => {
        alert("Error saving student information: " + error.message);
        console.error(error);
    });
}
</script>

{% endblock %}
