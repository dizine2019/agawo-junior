<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
				<title>Agawo Comprehensive School</title>

				<!-- Tailwind CSS CDN Engine -->
				<script src="https://tailwindcss.com"></script>

				<!-- 🛠️ CRITICAL BACKUP CSS (Ensures it stays professional even if internet drops) -->
				<style>
					body {
					font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
					background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 50%, #3b82f6 100%);
					min-height: 100vh;
					margin: 0;
					display: flex;
					align-items: center;
					justify-content: center;
					padding: 16px;
					box-sizing: border-box;
					}
					.login-card {
					background-color: #ffffff;
					width: 100%;
					max-width: 448px;
					padding: 32px;
					border-radius: 16px;
					box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
					box-sizing: border-box;
					}
					.input-field {
					width: 100%;
					padding: 14px;
					border: 1px solid #d1d5db;
					border-radius: 8px;
					margin-bottom: 16px;
					font-size: 16px;
					box-sizing: border-box;
					}
					.input-field:focus {
					outline: none;
					border-color: #2563eb;
					box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
					}
					.btn-primary {
					width: 100%;
					background-color: #2563eb;
					color: #ffffff;
					padding: 14px;
					border: none;
					border-radius: 8px;
					font-weight: 700;
					font-size: 16px;
					cursor: pointer;
					margin-bottom: 16px;
					}
					.btn-primary:hover { background-color: #1d4ed8; }

					.btn-student {
					display: block;
					text-align: center;
					text-decoration: none;
					border: 2px solid #2563eb;
					color: #2563eb;
					padding: 12px;
					border-radius: 8px;
					font-weight: 700;
					box-sizing: border-box;
					}
					.btn-student:hover { background-color: #eff6ff; }
				</style>
			</head>
	<body class="bg-gradient-to-br from-blue-900 via-blue-700 to-blue-500 min-h-screen flex items-center justify-center p-4">

		<!-- Main Card -->
		<div class="login-card bg-white w-full max-w-md p-6 sm:p-8 rounded-2xl shadow-2xl mx-auto">

			<!-- Branding Header -->
			<h1 class="text-3xl font-black text-center text-blue-700 tracking-tight mb-1" style="color: #1d4ed8;">
				AGAWO SCHOOL
			</h1>
			<p class="text-center text-gray-400 font-medium uppercase tracking-wider text-xs mb-8" style="color: #9ca3af;">
				School Management System
			</p>

			<!-- Message Error Box -->
			{% if error %}
			<div class="bg-red-50 text-red-600 border border-red-200 p-3 rounded-lg mb-5 text-sm text-center font-semibold" style="background-color: #fef2f2; color: #dc2626; border: 1px solid #fca5a5;">
				{{ error }}
			</div>
			{% endif %}

			<!-- Interactive Form -->
			<form method="POST" class="mb-6">
				{% csrf_token %}

				<label class="block text-xs font-bold text-gray-500 uppercase mb-1" style="color: #6b7280;">Username</label>
				<input type="text" name="username" placeholder="Enter your username" required=""
					   class="input-field w-full p-4 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500 text-base">

					<label class="block text-xs font-bold text-gray-500 uppercase mb-1" style="color: #6b7280;">Password</label>
					<input type="password" name="password" placeholder="••••••••" required=""
						   class="input-field w-full p-4 border border-gray-300 rounded-lg mb-6 focus:outline-none focus:ring-2 focus:ring-blue-500 text-base">

						<button type="submit"
								class="btn-primary w-full bg-blue-600 text-white py-4 rounded-lg font-bold hover:bg-blue-700 active:scale-[0.98] transition-all duration-150 shadow-lg block">
							Sign In
						</button>
					</form>

			<!-- Portal Alternative Entrance Triggers -->
			<div class="border-t border-gray-100 pt-6" style="border-top: 1px solid #f3f4f6;">

				<!-- Only public unauthenticated link left active -->
				<a href="{% url 'students_portal' %}"
				   class="btn-student block w-full text-center border-2 border-blue-600 text-blue-600 py-3.5 rounded-lg font-bold hover:bg-blue-50 active:scale-[0.98] transition-all duration-150">
					Students Portal Access
				</a>

			</div>

			<!-- System Footer Copyright Notice -->
			<p class="text-center text-gray-400 text-xs tracking-wide mt-8" style="color: #9ca3af;">
				&copy; 2026 AgawoJunior Systems &bull; All Rights Reserved
			</p>

		</div>

	</body>
</html>
